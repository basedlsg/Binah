name: Deploy to GCP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  GCP_PROJECT: seven-l-prod
  GAR_LOCATION: us-central1
  SERVICE_NAME_GEN: gen-hunyuanworld
  SERVICE_NAME_RENDER: render-multiview
  SERVICE_NAME_PROCESSOR: processor

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run health checks
        run: |
          echo "🩺 Testing service health..."
          python3 -c "
          import requests
          import time

          services = [
              'https://gen-hunyuanworld-pmw5hj5h3a-uc.a.run.app/health',
              'https://render-multiview-pmw5hj5h3a-uc.a.run.app/health',
              'https://processor-pmw5hj5h3a-uc.a.run.app/health'
          ]

          for url in services:
              try:
                  start = time.time()
                  resp = requests.get(url, timeout=10)
                  elapsed = time.time() - start
                  if resp.status_code == 200:
                      print(f'✅ {url}: Healthy ({elapsed:.2f}s)')
                  else:
                      print(f'❌ {url}: HTTP {resp.status_code}')
                      exit(1)
              except Exception as e:
                  print(f'❌ {url}: {e}')
                  exit(1)

          print('🎉 All services are healthy!')
          "

      - name: Check autonomous research system
        run: |
          echo "🤖 Testing autonomous research system..."
          python3 -c "
          try:
              exec(open('autonomous_research.py').read())
              print('✅ Autonomous research system loaded successfully')
          except Exception as e:
              print(f'❌ Error in autonomous research system: {e}')
              exit(1)
          "

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Generator Image
        run: |
          echo "🏗️ Building generator service..."
          cd containers/generator
          docker build -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/gen/gen-hunyuanworld:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/gen/gen-hunyuanworld:${{ github.sha }}

      - name: Build and Push Renderer Image
        run: |
          echo "🎨 Building renderer service..."
          cd containers/renderer
          docker build -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/render/render-multiview:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/render/render-multiview:${{ github.sha }}

      - name: Build and Push Processor Image
        run: |
          echo "🔍 Building processor service..."
          cd containers/processor
          docker build -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/processor/processor:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/processor/processor:${{ github.sha }}

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Generator Service
        run: |
          echo "🚀 Deploying generator service..."
          gcloud run deploy ${{ env.SERVICE_NAME_GEN }} \
            --image=us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/gen/gen-hunyuanworld:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=gpu-services-sa@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --cpu=4 \
            --memory=16Gi \
            --max-instances=10 \
            --timeout=1800 \
            --concurrency=1

      - name: Deploy Renderer Service
        run: |
          echo "🎨 Deploying renderer service..."
          gcloud run deploy ${{ env.SERVICE_NAME_RENDER }} \
            --image=us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/render/render-multiview:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=gpu-services-sa@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --cpu=4 \
            --memory=16Gi \
            --max-instances=10 \
            --timeout=1800 \
            --concurrency=1

      - name: Deploy Processor Service
        run: |
          echo "🔍 Deploying processor service..."
          gcloud run deploy ${{ env.SERVICE_NAME_PROCESSOR }} \
            --image=us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/processor/processor:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=pipeline-sa@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --cpu=2 \
            --memory=4Gi \
            --max-instances=5 \
            --timeout=900

  autonomous-research:
    name: Run Autonomous Research
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-storage requests

      - name: Run Autonomous Research Check
        run: |
          echo "🤖 Running autonomous research system..."
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/sa-key.json

          python3 autonomous_research.py

      - name: Upload Generated Papers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-papers
          path: generated_papers/
          if-no-files-found: ignore

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [test, deploy, autonomous-research]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary:"
          echo "• Tests: ${{ needs.test.result }}"
          echo "• Build & Push: ${{ needs.build-and-push.result }}"
          echo "• Deploy: ${{ needs.deploy.result }}"
          echo "• Autonomous Research: ${{ needs.autonomous-research.result }}"

          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🎉 Deployment successful!"
            echo "🔗 Services available at:"
            echo "  • Generator: https://gen-hunyuanworld-pmw5hj5h3a-uc.a.run.app"
            echo "  • Renderer: https://render-multiview-pmw5hj5h3a-uc.a.run.app"
            echo "  • Processor: https://processor-pmw5hj5h3a-uc.a.run.app"
          else
            echo "❌ Deployment had issues"
            exit 1
          fi
