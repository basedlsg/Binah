name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run linter
      run: |
        ruff check .

  docker-build-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [generator, renderer, labeler, checker, trainer]
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker image for ${{ matrix.service }}
      run: |
        docker build -t ${{ matrix.service }}:ci --file containers/${{ matrix.service }}/Dockerfile .