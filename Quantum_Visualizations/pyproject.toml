[tool.poetry]
name = "quantum-visualization"
version = "0.1.0"
description = "Interactive visualization suite for VQA loss landscapes."
authors = ["Carlos <carlos@example.com>"]
readme = "README.md"
packages = [{include = "quantum_visualization", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
polars = "^0.20.0"
matplotlib = "^3.8.0"
numpy = "^1.24.0"
orqviz = "^0.4.0"
dash = "^2.14.0"
plotly = "^5.17.0"
pyzmq = "^25.1.0"
protobuf = "^6.30.0"
grpcio-tools = "^1.59.0"
scikit-learn = "^1.7.0"
# AWS and Quantum Computing
boto3 = "^1.34.0"
amazon-braket-sdk = "^1.73.0"
qiskit = "^0.45.0"
qiskit-aer = "^0.13.0"
qiskit-ibm-runtime = "^0.17.0"
qiskit-nature = "^0.7.0"
# Deployment
gunicorn = "^21.2.0"
uvicorn = "^0.24.0"

[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.73.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
